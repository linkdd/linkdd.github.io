<section class="container px-3">
  <div class="content">
    <h2 class="title is-size-4">
      &#128226;
      Languages
    </h2>

    <table class="table is-fullwidth is-narrow is-hoverable">
      <tbody>
        {{ range .Site.Data.languages }}
          <tr>
            <td class="is-narrow"><b>{{ .lang }}</b></td>
            <td>{{ .level }}</td>
          </tr>
        {{ end }}
      </tbody>
    </table>
  </div>

  <hr class="is-hidden-print" />
</section>
